version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "../internal/adapter/outbound/postgres/sqlcgen"
        overrides:
          - db_type: "bigint[]"
            go_type:
              import: "github.com/lib/pq"
              type: "Int64Array"
